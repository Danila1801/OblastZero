name: Unity CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  buildForPlayModeTests:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-OblastZero
          restore-keys: Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: UnityEditor.BuildPipeline.BuildPlayer
          buildName: OblastZero
          # Without Steamworks define (no-op mode), CI passes on clean fork
          allowDirtyBuild: true

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ./
          testMode: playmode
          artifactsPath: test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: test-results

  lint:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate item JSONs
        run: |
          python -c "
          import json, glob, os, sys
          errs = []
          required = {'id','displayName','category','weightKg','durability','decayPerDay','utilityTags','radiationContaminated','radiationContaminationLevel','baseTradeValueScale','baseTradeValueCordon','baseTradeValueKafedra'}
          for f in glob.glob('Assets/Data/Resources/Items/*.json'):
              try:
                  d = json.load(open(f))
                  missing = required - d.keys()
                  if missing: errs.append(f'{f}: missing {missing}')
              except Exception as e:
                  errs.append(f'{f}: {e}')
          if errs:
              for e in errs: print(e, file=sys.stderr)
              sys.exit(1)
          print(f'✅ Validated {len(glob.glob(chr(65)+chr(115)+chr(115)+chr(101)+chr(116)+chr(115)+chr(47)+chr(68)+chr(97)+chr(116)+chr(97)+chr(47)+chr(82)+chr(101)+chr(115)+chr(111)+chr(117)+chr(114)+chr(99)+chr(101)+chr(115)+chr(47)+chr(73)+chr(116)+chr(101)+chr(109)+chr(115)+chr(47)+chr(42)+chr(46)+chr(106)+chr(115)+chr(111)+chr(110)))} item JSONs')"
      - name: Validate event JSONs
        run: |
          python -c "
          import json, glob, sys
          errs = []
          required = {'id','title','narrativeText','prerequisites','baseWeight','choices'}
          for f in glob.glob('Assets/Data/Resources/Events/*.json'):
              try:
                  d = json.load(open(f))
                  missing = required - d.keys()
                  if missing: errs.append(f'{f}: missing {missing}')
                  if not d.get('choices'): errs.append(f'{f}: no choices')
              except Exception as e:
                  errs.append(f'{f}: {e}')
          if errs:
              for e in errs: print(e, file=sys.stderr)
              sys.exit(1)
          print(f'✅ Validated event JSONs')"
